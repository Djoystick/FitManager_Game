name: "Form Decay Cron (Daily)"

on:
  schedule:
    - cron: '10 0 * * *'  # 00:10 UTC every day (after stamina-regen at 00:05)
  workflow_dispatch:       # Manual trigger from GitHub UI for testing

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Form Decay
        run: |
          HTTP_STATUS=$(curl -s -o /tmp/response.txt -w "%{http_code}" \
            -X GET "https://fit-manager-game.vercel.app/api/cron/form-decay?secret=${{ secrets.CRON_SECRET_MANUAL }}")
          cat /tmp/response.txt
          echo "HTTP Status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -ge 500 ]; then
            echo "ERROR: Form decay cron returned $HTTP_STATUS"
            exit 1
          fi
