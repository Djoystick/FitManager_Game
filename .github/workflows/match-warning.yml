name: "Match Warning Cron"

on:
  schedule:
    - cron: '45 * * * *'  # Every hour at minute :45 (UTC) — 15 min before the next round
  workflow_dispatch:       # Manual trigger from GitHub UI

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Match Warning
        run: |
          HTTP_STATUS=$(curl -s -o /tmp/response.txt -w "%{http_code}" \
            -X GET "https://fit-manager-game.vercel.app/api/cron/match-warning?secret=${{ secrets.CRON_SECRET_MANUAL }}")
          cat /tmp/response.txt
          echo "HTTP Status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -ge 500 ]; then
            echo "ERROR: Server returned $HTTP_STATUS"
            exit 1
          fi
