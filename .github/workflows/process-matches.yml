name: "Process Matches Cron"

on:
  schedule:
    - cron: '0 * * * *'  # Every hour at minute :00 (UTC)
  workflow_dispatch:      # Manual trigger from GitHub UI

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Match Processing
        run: |
          HTTP_STATUS=$(curl -s -o /tmp/response.txt -w "%{http_code}" \
            -X GET "https://fit-manager-game.vercel.app/api/cron/process-matches?secret=${{ secrets.CRON_SECRET_MANUAL }}")
          cat /tmp/response.txt
          echo "HTTP Status: $HTTP_STATUS"
          # Exit non-zero only on server error (5xx), not on cooldown (200)
          if [ "$HTTP_STATUS" -ge 500 ]; then
            echo "ERROR: Server returned $HTTP_STATUS"
            exit 1
          fi
